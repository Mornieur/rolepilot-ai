name: Scheduled job collection

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger scheduled collection
        env:
          SCHEDULER_URL: ${{ secrets.ROLEPILOT_SCHEDULER_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          test -n "$SCHEDULER_URL"
          test -n "$SCHEDULER_SECRET"
          if ! status="$(curl --silent --show-error --output /tmp/collection-response \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 210 --request POST \
            --header "Authorization: Bearer $SCHEDULER_SECRET" \
            "$SCHEDULER_URL/api/collection/scheduled")"; then
            echo "Scheduled collection request failed before receiving an HTTP response." >&2
            exit 1
          fi
          case "$status" in
            2??) cat /tmp/collection-response ;;
            409) echo "Collection already in progress; skipping this scheduled invocation." ;;
            *) cat /tmp/collection-response >&2; exit 1 ;;
          esac

  deliver-notifications:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pending Telegram delivery
        env:
          NOTIFICATION_WORKER_URL: ${{ secrets.NOTIFICATION_WORKER_URL }}
          NOTIFICATION_WORKER_SECRET: ${{ secrets.NOTIFICATION_WORKER_SECRET }}
        run: |
          test -n "$NOTIFICATION_WORKER_URL"
          test -n "$NOTIFICATION_WORKER_SECRET"
          curl --fail --silent --show-error --max-time 60 --request POST \
            --header "Authorization: Bearer $NOTIFICATION_WORKER_SECRET" \
            "$NOTIFICATION_WORKER_URL/api/notifications/deliver"
