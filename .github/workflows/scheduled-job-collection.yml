name: Scheduled job collection

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled collection
        env:
          SCHEDULER_URL: ${{ secrets.ROLEPILOT_SCHEDULER_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          test -n "$SCHEDULER_URL"
          test -n "$SCHEDULER_SECRET"
          curl --fail --silent --show-error --max-time 60 --request POST \
            --header "Authorization: Bearer $SCHEDULER_SECRET" \
            "$SCHEDULER_URL/api/collection/scheduled"

  deliver-notifications:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pending Telegram delivery
        env:
          NOTIFICATION_WORKER_URL: ${{ secrets.ROLEPILOT_NOTIFICATION_WORKER_URL }}
          NOTIFICATION_WORKER_SECRET: ${{ secrets.NOTIFICATION_WORKER_SECRET }}
        run: |
          test -n "$NOTIFICATION_WORKER_URL"
          test -n "$NOTIFICATION_WORKER_SECRET"
          curl --fail --silent --show-error --max-time 60 --request POST \
            --header "Authorization: Bearer $NOTIFICATION_WORKER_SECRET" \
            "$NOTIFICATION_WORKER_URL/api/notifications/deliver"
